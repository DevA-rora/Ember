name: Ember
options:
  bundleIdPrefix: com.ember
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.18.0
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Ember:
    type: application
    platform: iOS
    sources:
      - Ember
      - Shared
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseAILogic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ember.app
        PRODUCT_NAME: Ember
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ember
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: YES
        SUPPORTED_PLATFORMS: iphonesimulator iphoneos
        SDKROOT: iphoneos
        OTHER_LDFLAGS: "$(inherited) -ObjC"
  EmberSync:
    type: tool
    platform: macOS
    sources:
      - EmberSync
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ember.sync
        PRODUCT_NAME: ember-sync
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        SDKROOT: macosx
